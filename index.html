<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inSign Licensing Server</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e1e4ea; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1a1d26; border: 1px solid #2e3444; border-radius: 12px; padding: 32px 40px; text-align: center; max-width: 440px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .badge { display: inline-block; background: #163824; color: #4ade80; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; margin-bottom: 16px; border: 1px solid #22c55e44; }
        h1 { font-size: 22px; margin: 0 0 8px; color: #fff; }
        p { color: #8b949e; font-size: 14px; margin: 0 0 20px; line-height: 1.5; }
        .endpoint { background: #111319; border: 1px solid #2e3444; border-radius: 6px; padding: 10px 14px; font-family: monospace; font-size: 13px; color: #58a6ff; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Operational</span>
        <h1>inSign Licensing Service</h1>
        <p>Online authentication and hardware lock registry for inSignSender Pro.</p>
        <div class="endpoint">GET /licenses.json</div>
    </div>
</body>
</html>
